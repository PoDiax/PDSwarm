name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'
      title:
        description: 'Release title (optional)'
        required: false
        default: ''
      notes:
        description: 'Release description / notes (optional, markdown supported)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Information
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            IS_PRE_EXISTING="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            IS_PRE_EXISTING="false"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            IS_PRE_EXISTING="false"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "pre_existing=${IS_PRE_EXISTING}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Svelte Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Multi-Arch Static Binaries
        run: |
          mkdir -p dist
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/pdswarm-linux-amd64 ./cmd/pdswarm
          
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/pdswarm-linux-arm64 ./cmd/pdswarm

          # Pack archives and generate checksums
          cd dist
          tar -czvf pdswarm-linux-amd64.tar.gz pdswarm-linux-amd64
          tar -czvf pdswarm-linux-arm64.tar.gz pdswarm-linux-arm64
          sha256sum * > checksums.txt
          cd ..

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          ASSETS=(
            dist/pdswarm-linux-amd64
            dist/pdswarm-linux-arm64
            dist/pdswarm-linux-amd64.tar.gz
            dist/pdswarm-linux-arm64.tar.gz
            dist/checksums.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/updating assets with --clobber..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG..."
            CREATE_ARGS=("$TAG" "${ASSETS[@]}")
            
            if [ -n "$TITLE" ]; then
              CREATE_ARGS+=(--title "$TITLE")
            else
              CREATE_ARGS+=(--title "PDSwarm $TAG")
            fi
            
            if [ -n "$NOTES" ]; then
              CREATE_ARGS+=(--notes "$NOTES")
            else
              CREATE_ARGS+=(--generate-notes)
            fi
            
            gh release create "${CREATE_ARGS[@]}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
