name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Check and Build Frontend
        run: |
          cd web
          npm ci
          npm run check
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Backend Tests
        run: |
          CGO_ENABLED=0 go test -v ./...

      - name: Build Static Binary Check
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o pdswarm ./cmd/pdswarm
          ./pdswarm -version
