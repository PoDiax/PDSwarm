changelog:
  categories:
    - title: "✨ What's New"
      labels:
        - "feature"
        - "enhancement"
        - "feat"
    - title: "🛠 Improvements & Tweaks"
      labels:
        - "refactor"
        - "perf"
        - "docs"
        - "chore"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
  exclude:
    labels:
      - "ignore-for-release"
